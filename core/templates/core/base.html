{% load static %}
<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% block title %} 
        Saveur de Riz | Traiteur asiatique à Verviers 
      {%endblock %}
    </title>
    <meta
      name="description"
      content="{% block meta_description %}Saveur de Riz, traiteur asiatique à Verviers. Découvrez nos spécialités vietnamiennes et thaïlandaises, plats à emporter et services traiteur pour particuliers et professionnels.{% endblock %}"
    />
    <meta name="robots" content="index, follow" />
    <link
      rel="canonical"
      href="https://www.saveur-de-riz.be{{ request.path }}"
    />

    <link
      rel="icon"
      type="image/png"
      href="{% static 'core/images/favicon.png' %}"
    />
    <link
      rel="apple-touch-icon"
      href="{% static 'core/images/favicon.png' %}"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saveur de Riz" />
    <meta property="og:locale" content="fr_BE" />
    <meta
      property="og:title"
      content="{% block og_title %}Saveur de Riz | Traiteur asiatique à Verviers{% endblock %}"
    />
    <meta
      property="og:description"
      content="{% block og_description %}Traiteur asiatique spécialisé dans la cuisine traditionnelle vietnamienne et thaïlandaise à Verviers.{% endblock %}"
    />
    <meta
      property="og:url"
      content="https://www.saveur-de-riz.be{{ request.path }}"
    />
    <meta
      property="og:image"
      content="https://www.saveur-de-riz.be{% static 'core/images/og-image.jpg' %}"
    />
    <meta
      property="og:image:alt"
      content="Saveur de Riz - Traiteur asiatique à Verviers"
    />
    <meta property="og:image:type" content="image/jpeg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="{% block twitter_title %}Saveur de Riz | Traiteur asiatique à Verviers{% endblock %}"
    />
    <meta
      name="twitter:description"
      content="{% block twitter_description %}Traiteur asiatique vietnamien et thaïlandais à Verviers.{% endblock %}"
    />
    <meta
      name="twitter:image"
      content="https://www.saveur-de-riz.be{% static 'core/images/og-image.jpg' %}"
    />
    <meta
      name="twitter:image:alt"
      content="Saveur de Riz - Traiteur asiatique à Verviers"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script>
      (function () {
        const theme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <link rel="stylesheet" href="{% static 'core/css/variables.css' %}" />
    <link rel="stylesheet" href="{% static 'core/css/global.css' %}" />
    <link rel="stylesheet" href="{% static 'core/css/header.css' %}" />
    <link rel="stylesheet" href="{% static 'core/css/footer.css' %}" />

    {% block extra_css %}{% endblock %}
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- INCLUDE THE HEADER HERE -->
    {% include 'core/header.html' %}

    <main
      class="flex-grow-1 d-flex justify-content-center align-items-center text-center py-5"
      style="padding: 40px 20px"
    >
      <div class="container">{% block content %} {% endblock %}</div>
    </main>

    <!-- Shared Footer -->
    {% include 'core/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'core/js/theme.js' %}"></script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
